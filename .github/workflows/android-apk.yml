name: APK Android

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'android/**'
      - 'web/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Gerar index.html do app a partir de web/
        run: node scripts/prepare-android-web.mjs

      - name: Compilar APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk globo-paises-capitais.apk

      - uses: actions/upload-artifact@v4
        with:
          name: globo-paises-capitais-apk
          path: globo-paises-capitais.apk

      - name: Publicar na página de Releases (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: globo-paises-capitais.apk
