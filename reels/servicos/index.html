<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Story Serviços de Fogão</title>
<link href="../fonts/fonts.css" rel="stylesheet">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Story da Ramalho Fogões: serviços de fogão/cooktop. 1080x1920, 20s, 120 BPM.
// Parâmetros opcionais: ?nome=...&zap=...&cidade=...
const W = 1080, H = 1920, DUR = 20;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const EM = '"Noto Color Emoji"';
const Q = new URLSearchParams(location.search);
const NOME = Q.get('nome') || 'RAMALHO FOGÕES', ZAP = Q.get('zap') || '(41) 98485-1317', CIDADE = Q.get('cidade') || 'Curitiba e região';
const C = { blue: '#2E9BFF', ice: '#BFE6FF', orange: '#FF8A1F', yellow: '#FFD23F', green: '#25D366', red: '#FF4D5E', bg: '#0B0D12' };

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eOutBack = x => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// fotos (o cooktop preto é recortado pra tirar a faixa do canto)
const PH = {
  vermelho: { src: 'cooktop-vermelho.jpg', crop: null },
  preto: { src: 'cooktop-preto.jpg', crop: [0, 150, 760, 810] },
  inox: { src: 'fogao-inox.jpg', crop: null },
  forno: { src: 'forno.jpg', crop: [0, 250, 1200, 1350] },
};
const imgReady = Promise.all(Object.values(PH).map(p => new Promise(res => { const i = new Image(); i.onload = res; i.onerror = res; i.src = 'img/' + p.src; p.img = i; })));

const HITS = [[.3, 34], [.55, 14], [.8, 18], [2.5, 16], [3.0, 16], [3.5, 16], [4.0, 18], [6.0, 60], [7.5, 18], [9.0, 18], [10.5, 18], [12.0, 18], [13.5, 24], [14.5, 20], [16.5, 40]];
const FLASHES = [[.3, .9, .3], [2.5, .25, .1], [3.0, .25, .1], [3.5, .25, .1], [4.0, .3, .1], [6.0, 1, .45], [7.5, .35, .12], [9.0, .35, .12], [10.5, .35, .12], [12.0, .35, .12], [13.5, .4, .15], [16.5, .6, .3]];
function shake(t) { let s = 0; for (const [h, a] of HITS) { const d = t - h; if (d >= 0 && d < .7) s += a * Math.exp(-d * 9); } return s; }
function kickEnv(t) { if (t < 6 || t >= 19.5) return 0; const ph = t % 2; let best = 9; for (const p of [0, 3, 8, 11]) { const d = ph - p * .125; if (d >= 0) best = Math.min(best, d); } return Math.exp(-best * 10); }

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function fitSize(txt, font, max, maxW) { ctx.font = font.replace('$', max); const w = ctx.measureText(txt).width; return Math.min(max, max * maxW / w); }
function text(txt, x, y, font, fill, align = 'center', stroke = 0) {
  ctx.font = font; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(txt, x, y); }
  ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}
function grad(x0, x1, a, b) { const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
function glow(x, y, r, col, a) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1; }

function slam(txt, st, t, y, max, o = {}) {
  if (t < st) return;
  const d = t - st, s = 1 + (o.from ?? .8) * (1 - eOutExpo(prog(t, st, st + .16)));
  const size = fitSize(txt, '$px Anton, ' + EM, max, o.maxW || 960), font = `${size}px Anton, ${EM}`;
  ctx.save(); ctx.globalAlpha = prog(t, st, st + .04) * (o.alpha ?? 1); ctx.translate(540, y); ctx.scale(s, s);
  ctx.font = font; const w = ctx.measureText(txt).width;
  const split = 16 * Math.exp(-d * 8);
  if (split > .5) { ctx.globalCompositeOperation = 'lighter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(255,90,40,.6)'; ctx.fillText(txt, -split, 0); ctx.fillStyle = 'rgba(40,150,255,.6)'; ctx.fillText(txt, split, 0); ctx.globalCompositeOperation = 'source-over'; }
  text(txt, 0, 0, font, o.g ? grad(-w / 2, w / 2, o.g[0], o.g[1]) : (o.color || '#fff'), 'center', size * .09);
  ctx.restore();
}
function sticker(txt, st, t, x, y, size, bg, fg, rot = 0) {
  if (t < st) return; const s = eOutBack(prog(t, st, st + .28)); if (s <= 0) return;
  const font = `900 ${size}px Inter, ${EM}`; ctx.font = font; const w = ctx.measureText(txt).width;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8; ctx.fillStyle = bg; rr(-w / 2 - 30, -size * .85, w + 60, size * 1.7, size * .5); ctx.fill(); ctx.shadowColor = 'transparent';
  text(txt, 0, 2, font, fg); ctx.restore();
}

// ---------- queimador desenhado (chama azul certa x chama amarela com problema) ----------
function burner(cx, cy, r, t, mode = 'blue', ign = 1) {
  const sq = .36, N = 30;
  ctx.save();
  glow(cx, cy - r * .1, r * 2.2, mode === 'blue' ? 'rgba(46,155,255,1)' : 'rgba(255,140,30,1)', .35 * ign);
  // base de metal
  ctx.fillStyle = '#3a3f48'; ctx.beginPath(); ctx.ellipse(cx, cy + r * .08, r * 1.5, r * 1.5 * sq, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#8a929e'; ctx.beginPath(); ctx.ellipse(cx, cy, r * 1.38, r * 1.38 * sq, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#5b626d'; ctx.beginPath(); ctx.ellipse(cx, cy, r * 1.1, r * 1.1 * sq, 0, 0, 7); ctx.fill();
  const flames = [];
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * sq;
    let h, w;
    if (mode === 'blue') { h = r * (.26 + .05 * Math.sin(t * 23 + i * 1.7) + .03 * Math.sin(t * 37 + i)); w = r * .07; }
    else { h = r * (.55 + .22 * Math.sin(t * 9 + i * 2.3) + .12 * Math.sin(t * 17 + i * .7)); w = r * .1; }
    flames.push([Math.sin(a), x, y, h * ign, w, Math.cos(a)]);
  }
  const draw = f => {
    const [, x, y, h, w, ca] = f; if (h <= 1) return;
    const lean = ca * w * .8 + (mode === 'blue' ? 0 : Math.sin(t * 6 + x) * w * 1.5);
    const g = ctx.createLinearGradient(0, y, 0, y - h);
    if (mode === 'blue') { g.addColorStop(0, 'rgba(210,240,255,.95)'); g.addColorStop(.35, 'rgba(60,160,255,.9)'); g.addColorStop(1, 'rgba(30,90,255,0)'); }
    else { g.addColorStop(0, 'rgba(80,140,255,.8)'); g.addColorStop(.18, 'rgba(255,240,150,.95)'); g.addColorStop(.6, 'rgba(255,140,30,.8)'); g.addColorStop(1, 'rgba(255,80,0,0)'); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - w, y); ctx.quadraticCurveTo(x - w, y - h * .5, x + lean, y - h); ctx.quadraticCurveTo(x + w, y - h * .5, x + w, y); ctx.closePath(); ctx.fill();
  };
  ctx.globalCompositeOperation = 'lighter';
  flames.filter(f => f[0] < 0).forEach(draw);
  ctx.globalCompositeOperation = 'source-over';
  // tampa
  ctx.fillStyle = '#15171c'; ctx.beginPath(); ctx.ellipse(cx, cy - r * .06, r * .92, r * .92 * sq, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#23262d'; ctx.beginPath(); ctx.ellipse(cx, cy - r * .12, r * .8, r * .8 * sq, 0, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  flames.filter(f => f[0] >= 0).forEach(draw);
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
}
// fumacinha preta da chama amarela
function soot(cx, cy, t) {
  for (let i = 0; i < 7; i++) {
    const k = ((t * .6 + i / 7) % 1), x = cx + Math.sin(i * 2.1 + t) * 120 * k, y = cy - 150 - k * 420;
    ctx.globalAlpha = .35 * (1 - k) * Math.min(1, k * 5); ctx.fillStyle = '#2a2a2a';
    ctx.beginPath(); ctx.arc(x, y, 40 + k * 90, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function sparks(cx, cy, t, t0) {
  const d = t - t0; if (d < 0 || d > .25) return; const r = rng(Math.round(t0 * 100));
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 14; i++) { const a = r() * 6.28, v = 200 + r() * 500; ctx.globalAlpha = 1 - d / .25; ctx.fillRect(cx + Math.cos(a) * v * d, cy + Math.sin(a) * v * d * .5, 5, 5); }
  ctx.globalAlpha = 1;
}

function drawCover(img, crop, dx, dy, dw, dh, zoom = 1, ox = 0, oy = 0) {
  if (!img || !img.width) return;
  const [sx, sy, sw, sh] = crop || [0, 0, img.width, img.height];
  const s = Math.max(dw / sw, dh / sh) * zoom, w = sw * s, h = sh * s;
  ctx.drawImage(img, sx, sy, sw, sh, dx + (dw - w) / 2 + ox, dy + (dh - h) / 2 + oy, w, h);
}
function photoCard(p, cx, cy, w, h, zoom, rot, a = 1) {
  ctx.save(); ctx.globalAlpha = a; ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 25; ctx.fillStyle = '#fff'; rr(-w / 2 - 12, -h / 2 - 12, w + 24, h + 24, 40); ctx.fill(); ctx.shadowColor = 'transparent';
  rr(-w / 2, -h / 2, w, h, 30); ctx.clip(); drawCover(p.img, p.crop, -w / 2, -h / 2, w, h, zoom);
  ctx.restore();
}


function bg(t) {
  const g = ctx.createRadialGradient(540, 900, 100, 540, 900, 1300); g.addColorStop(0, '#171B24'); g.addColorStop(1, '#06070A'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const k = kickEnv(t);
  glow(540 + Math.sin(t * .5) * 300, 1600, 800, 'rgba(46,155,255,1)', .14 + k * .06);
  glow(540 + Math.cos(t * .4) * 300, 300, 700, 'rgba(255,138,31,1)', .10 + k * .05);
}
// foto em tela cheia com pan (ken burns) e "soco" de zoom na batida
function fullPhoto(p, t, st, dur, pan = 1, dark = .35) {
  const k = prog(t, st, st + dur), punch = 1 + .05 * kickEnv(t) + .12 * Math.exp(-(t - st) * 10);
  const [sx, sy, sw, sh] = p.crop || [0, 0, p.img.width, p.img.height];
  const s = Math.max(W / sw, H / sh) * 1.08 * punch, w = sw * s, h = sh * s;
  const ox = (w - W) / 2 * pan * (k * 2 - 1);
  if (p.img.width) ctx.drawImage(p.img, sx, sy, sw, sh, (W - w) / 2 - ox, (H - h) / 2, w, h);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, `rgba(0,0,0,${dark + .25})`); g.addColorStop(.35, 'rgba(0,0,0,0)'); g.addColorStop(.6, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${dark + .4})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
// brasinhas subindo
const EMB = (() => { const r = rng(5), o = []; for (let i = 0; i < 60; i++) o.push({ x: r() * W, sp: 120 + r() * 260, ph: r() * 10, s: 2 + r() * 5, c: r() < .5 ? C.orange : C.blue }); return o; })();
function embers(t, a) {
  if (a <= 0) return; ctx.globalCompositeOperation = 'lighter';
  for (const p of EMB) { const y = H + 40 - ((t + p.ph) * p.sp) % (H + 80), x = p.x + Math.sin(t * 2 + p.ph) * 30;
    ctx.globalAlpha = a * (.4 + .6 * Math.abs(Math.sin(t * 3 + p.ph))); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(x, y, p.s, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function shockwave(x, y, t, t0, col = C.blue) {
  const d = t - t0; if (d < 0 || d > .8) return; const k = d / .8;
  ctx.beginPath(); ctx.arc(x, y, 40 + eOutExpo(k) * 1200, 0, 7); ctx.strokeStyle = col; ctx.globalAlpha = 1 - k; ctx.lineWidth = 40 * (1 - k) + 2; ctx.stroke(); ctx.globalAlpha = 1;
}
function chip(txt, x, y, bg, fg, size = 40) {
  ctx.font = `900 ${size}px Inter`; const w = ctx.measureText(txt).width;
  ctx.fillStyle = bg; rr(x - w / 2 - 26, y - size * .8, w + 52, size * 1.6, 14); ctx.fill(); text(txt, x, y + 2, `900 ${size}px Inter`, fg);
}

// ---------- CENAS ----------
function sceneHook(t) {
  sparks(540, 1200, t, 0); sparks(540, 1200, t, .1); sparks(540, 1200, t, .2);
  if (t >= .3) { soot(540, 1250, t); burner(540, 1250, 330, t, 'yellow', eOutExpo(prog(t, .3, .6))); }
  slam('PARA DE', .3, t, 330, 170);
  slam('QUEIMAR', .55, t, 510, 230, { g: [C.yellow, C.orange] });
  slam('DINHEIRO 💸', .8, t, 720, 200);
  sticker('chama amarela = gás jogado fora', 1.5, t, 540, 1620, 40, C.orange, '#111', -.03);
}
const DORES = [[2.5, 'PANELA PRETA? 🖤'], [3.0, 'BOCA FALHANDO? 😤'], [3.5, 'FORNO NÃO ACENDE? 😩'], [4.0, 'CHEIRO DE GÁS? ⚠️']];
function scenePain(t) {
  if (t < 4.5) {
    const i = Math.min(3, Math.floor((t - 2.5) / .5)), [st, s] = DORES[i];
    soot(540, 1250, t); burner(540, 1250, 300 + i * 15, t, 'yellow');
    slam(s, st, t, 620, 150, { color: i === 3 ? C.yellow : '#fff', from: 1.2 });
    chip(`${i + 1}/4`, 540, 400, 'rgba(255,255,255,.15)', '#fff', 34);
    return;
  }
  // ANTES x DEPOIS com cortina
  ctx.save(); burner(540, 1050, 330, t, 'yellow'); soot(540, 1050, t); ctx.restore();
  const k = eInOut(prog(t, 4.75, 5.45)), cx = W * k;
  ctx.save(); ctx.beginPath(); ctx.rect(0, -100, cx, H + 200); ctx.clip();
  ctx.fillStyle = '#000'; ctx.fillRect(0, -100, W, H + 200); fullPhoto(PH.inox, t, 4.75, 1.0, 0, .15);
  ctx.restore();
  if (k > 0 && k < 1) { ctx.fillStyle = '#fff'; ctx.shadowColor = C.blue; ctx.shadowBlur = 40; ctx.fillRect(cx - 5, -100, 10, H + 200); ctx.shadowBlur = 0; }
  if (k < .55) chip('ANTES ❌', 540, 330, C.red, '#fff', 48);
  if (k > .45) chip('DEPOIS ✅', 540, 330, C.green, '#06240f', 48);
}
const SERV = [[7.5, 'vermelho', 'INSTALAÇÃO', 'DE COOKTOP'], [9.0, 'preto', 'REGULAGEM', 'DE CHAMA'], [10.5, 'inox', 'MANUTENÇÃO', 'DE FOGÃO'], [12.0, 'forno', 'CONSERTO', 'DE FORNO']];
function sceneBrand(t) {
  embers(t, 1); shockwave(540, 820, t, 6.0);
  burner(540, 820, 260 * eOutBack(prog(t, 6.0, 6.35)), t, 'blue');
  slam(NOME.split(' ')[0], 6.0, t, 1180, 230, { g: [C.ice, C.blue] });
  slam(NOME.split(' ').slice(1).join(' '), 6.25, t, 1390, 170);
  sticker('instalação · manutenção · conserto', 6.7, t, 540, 1560, 40, '#fff', '#111', -.02);
}
function sceneServices(t) {
  const i = Math.min(3, Math.floor((t - 7.5) / 1.5)), [st, key, l1, l2] = SERV[i];
  fullPhoto(PH[key], t, st, 1.5, 1);
  chip(`0${i + 1}`, 540, 300, C.blue, '#fff', 40);
  slam(l1, st + .05, t, 1380, 190, { from: 1.1 });
  slam(l2, st + .2, t, 1560, 130, { g: [C.yellow, C.orange], from: 1.1 });
}
function sceneGrid(t) {
  const keys = ['vermelho', 'preto', 'inox', 'forno'], cw = 500, ch = 640;
  keys.forEach((k, i) => {
    const st = 13.5 + i * .125, s = eOutBack(prog(t, st, st + .25)); if (s <= 0) return;
    const x = 290 + (i % 2) * 500, y = 760 + ((i / 2) | 0) * 660;
    ctx.save(); ctx.translate(x, y); ctx.rotate((i % 2 ? 1 : -1) * .03); ctx.scale(s, s);
    ctx.fillStyle = '#fff'; rr(-cw / 2 - 8, -ch / 2 - 8, cw + 16, ch + 16, 26); ctx.fill();
    rr(-cw / 2, -ch / 2, cw, ch, 20); ctx.clip(); drawCover(PH[k].img, PH[k].crop, -cw / 2, -ch / 2, cw, ch, 1 + .05 * kickEnv(t)); ctx.restore();
  });
  slam('TRABALHO DE VERDADE ✅', 13.6, t, 300, 110);
}
const PQ = [[14.5, '⚡ Atendimento rápido'], [15.0, '✨ Serviço limpo e caprichado'], [15.5, '🛡️ Segurança em 1º lugar'], [16.0, '💬 Orçamento sem compromisso']];
function sceneTrust(t) {
  embers(t, .5);
  slam('POR QUE A', 14.5, t, 330, 150);
  slam(NOME + '?', 14.5, t, 490, 150, { g: [C.yellow, C.orange] });
  PQ.forEach(([st, s], i) => {
    const a = eOutBack(prog(t, st, st + .3)); if (a <= 0) return;
    const y = 680 + i * 190, x = 90 + (1 - a) * 1000;
    ctx.fillStyle = 'rgba(255,255,255,.1)'; rr(x, y, 900, 150, 36); ctx.fill(); ctx.strokeStyle = i % 2 ? 'rgba(255,138,31,.6)' : 'rgba(46,155,255,.6)'; ctx.lineWidth = 3; ctx.stroke();
    text(s, x + 450, y + 77, `800 ${fitSize(s, '800 $px Inter, ' + EM, 52, 820)}px Inter, ${EM}`, '#fff');
  });
}
function sceneCTA(t) {
  embers(t, 1); shockwave(540, 1150, t, 16.5, C.green);
  burner(540, 420, 170, t, 'blue');
  slam('CHAMA NO', 16.5, t, 760, 170);
  slam('WHATSAPP 📲', 16.5, t, 950, 190, { g: ['#7CF29C', C.green] });
  const b = eOutBack(prog(t, 16.9, 17.2));
  if (b > 0) {
    const ring = Math.sin(t * 30) * 4 * (Math.floor(t * 2) % 2);
    ctx.save(); ctx.translate(540 + ring, 1170); ctx.scale(b * (1 + .04 * Math.sin(t * 8)), b * (1 + .04 * Math.sin(t * 8)));
    ctx.shadowColor = 'rgba(37,211,102,.7)'; ctx.shadowBlur = 50; ctx.fillStyle = C.green; rr(-450, -95, 900, 190, 95); ctx.fill(); ctx.shadowColor = 'transparent';
    // ícone de telefone
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-350, 0, 52, 0, 7); ctx.fill(); text('📞', -350, 4, `52px ${EM}`, '#fff');
    text(ZAP, 50, 4, `900 ${fitSize(ZAP, '900 $px Inter', 70, 640)}px Inter`, '#fff');
    ctx.restore();
  }
  ctx.globalAlpha = prog(t, 17.4, 17.7);
  text(NOME, 540, 1360, '900 60px Inter', '#fff', 'center', 6);
  text(`📍 ${CIDADE}`, 540, 1445, `700 44px Inter, ${EM}`, 'rgba(255,255,255,.85)', 'center', 5);
  ctx.globalAlpha = 1;
}

function glitch(R, n, amt) { for (let i = 0; i < n; i++) { const sy = R() * H, h = 8 + R() * 90, off = (R() - .5) * amt; ctx.drawImage(cv, 0, sy, W, h, off, sy, W, h); } }

function render(t) {
  const R = rng(Math.round(t * 30) * 7919 + 9);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  bg(t);
  const sh = shake(t); ctx.save(); ctx.translate((R() - .5) * 2 * sh, (R() - .5) * 2 * sh + 45); // +45: abaixo da barra do topo do story
  if (t < 2.5) sceneHook(t);
  else if (t < 6.0) scenePain(t);
  else if (t < 7.5) sceneBrand(t);
  else if (t < 13.5) sceneServices(t);
  else if (t < 14.5) sceneGrid(t);
  else if (t < 16.5) sceneTrust(t);
  else sceneCTA(t);
  ctx.restore(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const [h] of HITS) if (t >= h && t < h + .07) glitch(R, 5, 110);
  for (const [h, a, dur] of FLASHES) { const d = t - h; if (d >= 0 && d < dur) { ctx.fillStyle = `rgba(255,255,255,${a * (1 - d / dur)})`; ctx.fillRect(0, 0, W, H); } }
